
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlightZone ATC Console : Aurora Bay Aiport</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="app-wrapper">
        <div class="app-header">
            <h1 class="app-title">FLIGHTZONE ATC CONSOLE</h1>
        </div>

        <div class="console">
            <div class="header">
                <div class="title">FlightZone ATC Console : Aurora Bay Airport</div>
                <div class="status">
                    <div class="status-indicator"></div>
                    <span>ONLINE</span>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-item">
                    <span class="info-label">Messages:</span>
                    <span id="msg-count">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Local Time:</span>
                    <span id="local-time">--:--:--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Status:</span>
                    <span style="color: var(--green);">OPERATIONAL</span>
                </div>
            </div>

            <div id="chat" class="chatbox">
                <div class="msg ai">
                    <b>FlightZone:</b> System initialized. Ready for ATC operations.
                </div>
            </div>

            <div id="thinking" class="thinking">
                ▸ FlightZone processing<span id="dots"></span>
            </div>

            <div class="input-area">
                <div class="control-group">
                    <label class="control-label">ATC QUERY OR COMMAND</label>
                    <div class="input-wrapper">
                        <svg class="command-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
                        </svg>
                        <input id="input" placeholder="Enter ATC query or command..." autocomplete="off" />
                    </div>
                </div>
                <button class="transmit-button" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <div class="app-footer">
            @ 2026 Aurora Bay Airport AI ATC System.
        </div>
    </div>

    <script>
        let dotInterval;
        let messageCount = 0;

        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('local-time').textContent = timeStr;
        }

        setInterval(updateTime, 1000);
        updateTime();

        function startThinking() {
            const t = document.getElementById("thinking");
            const d = document.getElementById("dots");
            t.style.display = "block";
            let c = 0;
            dotInterval = setInterval(() => {
                d.textContent = ".".repeat((c % 3) + 1);
                c++;
            }, 400);
        }

        function stopThinking() {
            document.getElementById("thinking").style.display = "none";
            clearInterval(dotInterval);
        }

        async function sendMessage() {
            const input = document.getElementById("input");
            const chat = document.getElementById("chat");
            const text = input.value.trim();

            if (!text) return;

            input.disabled = true;
            document.querySelector('button').disabled = true;

            messageCount++;
            document.getElementById('msg-count').textContent = messageCount;

            chat.innerHTML += `<div class='msg user'><b>You:</b> ${escapeHtml(text)}</div>`;
            input.value = "";

            startThinking();
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                stopThinking();

                chat.innerHTML += `<div class='msg ai'><b>FlightZone:</b> ${escapeHtml(data.reply)}</div>`;
                chat.scrollTop = chat.scrollHeight;

            } catch (error) {
                stopThinking();
                console.error('Error:', error);
                chat.innerHTML += `<div class='msg ai' style='color: #ff6b6b;'><b>FlightZone:</b> Communication error. Please try again.</div>`;
            }

            input.disabled = false;
            document.querySelector('button').disabled = false;
            input.focus();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById("input").addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>

</body>

</html>
